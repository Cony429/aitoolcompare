
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool Compare 2026 | Sora, Claude 3.5, Gemini Performance & Pricing</title>
    <meta name="description" content="Compare the latest AI tools of 2026 at a glance. A professional AI comparison site with daily updates on the performance, ratings, and pricing of Sora, Claude 3.5, and Gemini 1.5 Pro.">
    <meta name="keywords" content="ai compare, ai tool comparison, best ai tools 2026, Sora vs Runway, AI tool comparison, AI recommendations">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
<header class="site-header">
  <div class="nav-container">
    <a href="index.html" class="logo">AI Tool Compare</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="compare.html">Compare</a>
      <a href="blog.html">Blog</a>
      <a href="news.html">News</a>
    </nav>
    <div class="lang-switch">
      <a href="index.html">EN</a> | <a href="index-ko.html">KO</a>
    </div>
  </div>
</header>

<div class="hero-section">
    <h1>Find the Perfect AI for You</h1>
    <p class="subtitle">Compare various AI tools and make the best choice.</p>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="e.g., video, image, writing, coding...">
        <button id="search-btn">Search</button>
    </div>
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterByCategory('All', event)">All</button>
        <button class="filter-btn" onclick="filterByCategory('Chatbot', event)">Chatbot</button>
        <button class="filter-btn" onclick="filterByCategory('Video', event)">Video</button>
        <button class="filter-btn" onclick="filterByCategory('Image', event)">Image</button>
        <button class="filter-btn" onclick="filterByCategory('Writing', event)">Writing</button>
        <button class="filter-btn" onclick="filterByCategory('Coding', event)">Coding</button>
        <button class="filter-btn" onclick="filterByCategory('Audio', event)">Audio</button>
    </div>
</div>

<main class="container">
    <h2 class="section-title">Featured AI Tools Directory</h2>
    <div class="table-container">
      <table id="tool-table">
        <thead>
          <tr>
            <th>Tool Name</th>
            <th>Description</th>
            <th>Rating</th>
            <th>Pricing</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="tool-table-body">
          <!-- AI tools will be dynamically inserted here -->
        </tbody>
      </table>
    </div>
</main>

<footer>
    <div class="footer-content">
        <p>&copy; 2024 AI Tool Compare. All rights reserved.</p>
        <nav>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy Policy</a>
        </nav>
    </div>
</footer>

<script>
    let allTools = [];
    let currentCategory = 'All';

    async function fetchTools() {
        try {
            const response = await fetch('ai-tools.json');
            allTools = await response.json();
            render();
        } catch (error) {
            console.error('Error loading AI tools:', error);
            document.getElementById('tool-table-body').innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>Could not load AI tools.</td></tr>";
        }
    }

    function displayFilteredTools(filteredTools) {
        const tableBody = document.getElementById('tool-table-body');
        tableBody.innerHTML = "";

        if (filteredTools.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>No matching AI tools found.</td></tr>";
            return;
        }

        filteredTools.forEach(tool => {
            const row = document.createElement('tr');
            let tagsHTML = '';
            const lowerCasePricing = tool.pricing.map(p => p.toLowerCase());

            if (lowerCasePricing.includes("free")) {
                tagsHTML += `<span class="tag free-tag">Free</span>`;
            }
            if (lowerCasePricing.includes("paid")) {
                tagsHTML += `<span class="tag paid-tag">Paid</span>`;
            }
            if (lowerCasePricing.includes("freemium")) {
                tagsHTML += `<span class="tag freemium-tag">Freemium</span>`;
            }

            row.innerHTML = `
                <td data-label="Tool Name">${tool.name}</td>
                <td data-label="Description">${tool.description}</td>
                <td data-label="Rating" class="tool-rating">${"⭐".repeat(Math.round(tool.rating))} ${tool.rating.toFixed(1)}</td>
                <td data-label="Pricing">${tagsHTML}</td>
                <td data-label="Link"><a href="${tool.link}" target="_blank" class="visit-site-btn">Visit Site</a></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function render(query = "") {
        const lowerCaseQuery = query.toLowerCase();
        let filteredTools = allTools;

        if (currentCategory !== 'All') {
            filteredTools = filteredTools.filter(tool => {
                if (!tool.category) return false;
                // Handle both array and string categories
                if (Array.isArray(tool.category)) {
                    return tool.category.map(c => c.toLowerCase()).includes(currentCategory.toLowerCase());
                } else {
                    return tool.category.toLowerCase() === currentCategory.toLowerCase();
                }
            });
        }

        if (lowerCaseQuery) {
            filteredTools = filteredTools.filter(tool => {
                const toolKeywords = tool.keywords ? tool.keywords.map(k => k.toLowerCase()) : [];
                return (
                    tool.name.toLowerCase().includes(lowerCaseQuery) || 
                    tool.description.toLowerCase().includes(lowerCaseQuery) ||
                    toolKeywords.some(keyword => keyword.includes(lowerCaseQuery))
                );
            });
        }
        
        displayFilteredTools(filteredTools);
    }

    function filterByCategory(category, event) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        currentCategory = category;
        
        const query = document.getElementById('search-input').value;
        render(query);
    }

    document.getElementById('search-btn').addEventListener('click', () => {
        const query = document.getElementById('search-input').value;
        render(query);
    });

    document.getElementById('search-input').addEventListener('keyup', (event) => {
        if (event.key === 'Enter') {
            const query = document.getElementById('search-input').value;
            render(query);
        }
    });

    fetchTools();
</script>
</body>
</html>
