        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.tags.toLowerCase().includes(val.toLowerCase()) ||
                t.desc.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center; padding: 20px;'>No matching AI tools found.</p>";
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement('a');
                item.href = t.url;
                item.target = "_blank";
                item.className = "tool-item";
                
                const roundedRating = Math.round(parseFloat(t.rate));
                const stars = '★'.repeat(roundedRating) + '☆'.repeat(5 - roundedRating);

                item.innerHTML = `
                    <div class="tool-info">
                        <div class="tool-header">
                            <div class="tool-title">${t.name}</div>
                            <div class="tool-meta">
                                <span class="tool-rating" title="${t.rate}/5">${stars}</span>
                                <span class="tool-price ${t.type.toLowerCase()}">${t.type}</span>
                            </div>
                        </div>
                        <p class="tool-description">${t.desc}</p>
                    </div>
                    <div class="btn-read-more">Visit Site</div>
                `;
                div.appendChild(item);
            });
        }

        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        render();
