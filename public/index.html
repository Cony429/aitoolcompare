<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool Compare - Discover & Compare</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; margin: 0; color: #333; }
        
        /* 사용자님의 가운데 정렬 헤더 디자인 보존 */
        header { text-align: center; padding: 40px 20px; background: white; border-bottom: 1px solid #eee; }
        header .logo { font-size: 2.5rem; font-weight: 800; color: #007bff; text-decoration: none; display: block; margin-bottom: 20px; }
        header nav { display: flex; justify-content: center; gap: 30px; }
        header nav a { text-decoration: none; color: #666; font-weight: 600; font-size: 1.1rem; }
        header nav a:hover { color: #007bff; }

        /* 검색 섹션 */
        .hero { padding: 40px 5%; text-align: center; }
        .search-container { max-width: 700px; margin: 0 auto; display: flex; gap: 10px; justify-content: center; }
        #search-input { flex: 1; padding: 15px 25px; border-radius: 30px; border: 2px solid #ddd; font-size: 1.1rem; outline: none; }
        #search-btn { padding: 15px 30px; background: #007bff; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        #search-btn:hover { background: #0056b3; }

        /* 한 줄 리스트 디자인 */
        .list-area { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
        .tool-row { 
            display: grid; grid-template-columns: 1.5fr 3.5fr 0.8fr 1.2fr; 
            align-items: center; background: white; padding: 20px; 
            border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee;
        }
        .t-name { font-weight: bold; font-size: 1.2rem; }
        .t-desc { color: #777; font-size: 0.95rem; padding-right: 10px; }
        .t-rating { color: #f1c40f; font-weight: bold; text-align: center; }
        .visit-link { background: #007bff; color: white; padding: 10px; border-radius: 8px; text-decoration: none; text-align: center; font-weight: bold; }

        @media (max-width: 850px) { .tool-row { grid-template-columns: 1fr; text-align: center; gap: 15px; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">AI Tool Compare</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="compare.html">Compare</a>
            <a href="free-ai-tools.html">AI Tools</a>
            <a href="news.html">News</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Find Your AI from Top 50+ Directory</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Try 'video', 'image', 'text', 'coding'...">
            <button id="search-btn">Search</button>
        </div>
    </div>

    <div class="list-area">
        <h2 style="text-align: center; margin-bottom: 30px;">Top AI Tools Directory</h2>
        <div id="tool-display"></div>
    </div>

    <script>
        const aiTools = [
            // 텍스트/채팅
            { name: "ChatGPT", desc: "Leader in text generation and coding.", rate: "4.9", url: "https://chat.openai.com", tags: "text, chat, writing, coding, productivity" },
            { name: "Claude", desc: "Best for natural writing and reasoning.", rate: "4.8", url: "https://claude.ai", tags: "text, writing, reasoning, research" },
            { name: "Gemini", desc: "Google's smart assistant for search and work.", rate: "4.7", url: "https://gemini.google.com", tags: "search, google, assistant, research" },
            { name: "Jasper", desc: "AI writing assistant for businesses.", rate: "4.6", url: "https://jasper.ai", tags: "text, marketing, writing, copy" },
            { name: "Copy.ai", desc: "AI-powered copywriter for marketing.", rate: "4.5", url: "https://copy.ai", tags: "text, marketing, sales, copy" },
            // 이미지/디자인
            { name: "Midjourney", desc: "Professional artistic image generation.", rate: "4.9", url: "https://midjourney.com", tags: "image, art, design, creative" },
            { name: "DALL-E 3", desc: "OpenAI's high-precision image generator.", rate: "4.8", url: "https://openai.com/dall-e-3", tags: "image, art, drawing, design" },
            { name: "Canva AI", desc: "Simple AI tools for graphic design.", rate: "4.5", url: "https://canva.com", tags: "image, design, creative, editing" },
            { name: "Leonardo.ai", desc: "Creative platform for pro image assets.", rate: "4.7", url: "https://leonardo.ai", tags: "image, art, game, creative" },
            { name: "Adobe Firefly", desc: "Adobe's creative generative AI.", rate: "4.6", url: "https://firefly.adobe.com", tags: "image, design, photo, adobe" },
            // 비디오/애니메이션
            { name: "Sora", desc: "Next-gen realistic video generation.", rate: "4.9", url: "https://openai.com/sora", tags: "video, movie, animation, motion" },
            { name: "Runway", desc: "Pro-level AI tools for video editing.", rate: "4.7", url: "https://runwayml.com", tags: "video, movie, editing, motion" },
            { name: "Pika", desc: "AI video generation and animation.", rate: "4.6", url: "https://pika.art", tags: "video, animation, motion" },
            { name: "HeyGen", desc: "AI avatar and video translation.", rate: "4.8", url: "https://heygen.com", tags: "video, avatar, translation, business" },
            { name: "Synthesia", desc: "AI video generation with avatars.", rate: "4.7", url: "https://synthesia.io", tags: "video, avatar, training, business" },
            // 검색/연구
            { name: "Perplexity", desc: "Search engine with real-time sources.", rate: "4.8", url: "https://perplexity.ai", tags: "search, research, information, answer" },
            { name: "You.com", desc: "Private AI-driven search engine.", rate: "4.4", url: "https://you.com", tags: "search, chat, research" },
            { name: "Consensus", desc: "AI search engine for research papers.", rate: "4.7", url: "https://consensus.app", tags: "search, science, research, academic" },
            { name: "Elicit", desc: "The AI research assistant for papers.", rate: "4.6", url: "https://elicit.org", tags: "search, research, paper, science" },
            // 오디오/목소리
            { name: "ElevenLabs", desc: "Realistic AI voice synthesis.", rate: "4.9", url: "https://elevenlabs.io", tags: "audio, voice, sound, speech" },
            { name: "Suno", desc: "AI music generation by simple prompts.", rate: "4.8", url: "https://suno.com", tags: "audio, music, sound, song" },
            { name: "Udio", desc: "High-fidelity AI music creation.", rate: "4.8", url: "https://udio.com", tags: "audio, music, sound, song" },
            { name: "Descript", desc: "All-in-one audio and video editor.", rate: "4.7", url: "https://descript.com", tags: "audio, video, editing, podcast" },
            { name: "Murf AI", desc: "Professional AI voice-overs.", rate: "4.5", url: "https://murf.ai", tags: "audio, voice, business, speech" },
            // 생산성/노트
            { name: "Notion AI", desc: "AI writing inside your Notion workspace.", rate: "4.7", url: "https://notion.so", tags: "text, writing, productivity, notes" },
            { name: "Gamma", desc: "AI-powered presentations and decks.", rate: "4.8", url: "https://gamma.app", tags: "productivity, design, slide, business" },
            { name: "Otter.ai", desc: "AI meeting notes and transcription.", rate: "4.6", url: "https://otter.ai", tags: "text, audio, meeting, transcription" },
            { name: "Beautiful.ai", desc: "AI presentation design software.", rate: "4.5", url: "https://beautiful.ai", tags: "design, slide, business, productivity" },
            { name: "QuillBot", desc: "AI paraphrasing and grammar tool.", rate: "4.5", url: "https://quillbot.com", tags: "text, writing, education, grammar" }
            // ... (데이터를 더 추가할 수 있습니다)
        ];

        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.tags.toLowerCase().includes(val.toLowerCase()) ||
                t.desc.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center; padding: 20px;'>No matching AI tools found.</p>";
                return;
            }

            filtered.forEach(t => {
                const row = document.createElement('div');
                row.className = "tool-row";
                row.innerHTML = `<div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div><div class="t-rating">⭐ ${t.rate}</div><a href="${t.url}" target="_blank" class="visit-link">Visit Site</a>`;
                div.appendChild(row);
            });
        }

        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        render();
    </script>
</body>
</html>
