<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool Compare - Discover & Compare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. 헤더: 기존의 가운데 정렬 디자인 복구 */
        header { 
            text-align: center; 
            padding: 2rem 0; 
            background: white; 
            border-bottom: 1px solid #eee; 
        }
        header .logo { 
            font-size: 2rem; 
            font-weight: bold; 
            color: #333; 
            text-decoration: none;
            display: block;
            margin-bottom: 1rem;
        }
        header nav { 
            display: flex; 
            justify-content: center; 
            gap: 2rem; 
        }
        header nav a { 
            text-decoration: none; 
            color: #666; 
            font-weight: 500; 
        }

        /* 2. Hero & 검색창 */
        .hero { padding: 60px 5%; text-align: center; }
        .search-container { max-width: 600px; margin: 20px auto; }
        #search-input { 
            width: 100%; padding: 15px 25px; border-radius: 30px; 
            border: 1px solid #ddd; font-size: 1.1rem; outline: none;
        }

        /* 3. 비교 배틀 (5개 박스) */
        .battle-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; padding: 20px 5%; 
        }
        .battle-card { 
            background: white; border: 1px solid #eee; padding: 20px; 
            border-radius: 12px; text-align: center; 
        }
        .vs-text { font-weight: bold; color: #ff4757; }

        /* 4. Top 10 리스트 (한 줄 정렬) */
        .list-section { max-width: 1000px; margin: 50px auto; padding: 0 5%; }
        .tool-row { 
            display: grid; 
            grid-template-columns: 1.2fr 3fr 0.8fr 1fr; /* 이름 | 설명 | 별점 | 버튼 */
            align-items: center; 
            background: white; 
            padding: 15px 20px; 
            border-bottom: 1px solid #eee; 
            transition: 0.2s;
        }
        .tool-row:hover { background: #f9f9f9; }
        .tool-name { font-weight: bold; }
        .tool-desc { color: #666; font-size: 0.9rem; }
        .tool-rating { color: #ffc107; font-weight: bold; text-align: center; }
        .visit-btn-small { 
            background: #007bff; color: white; padding: 8px; 
            border-radius: 5px; text-decoration: none; text-align: center; font-size: 0.8rem; 
        }

        @media (max-width: 768px) {
            .tool-row { grid-template-columns: 1fr; text-align: center; gap: 10px; padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">AI Tool Compare</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News</a>
            <a href="free-ai-tools.html">Free Tools</a>
            <a href="compare.html">Compare</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Which AI tool is right for you?</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for AI tools...">
        </div>
    </section>

    <h2 style="text-align: center;">Head-to-Head Battles</h2>
    <div class="battle-grid">
        <div class="battle-card"><h3>ChatGPT <span class="vs-text">VS</span> Claude</h3><a href="chatgpt-vs-claude.html">Compare →</a></div>
        <div class="battle-card"><h3>Midjourney <span class="vs-text">VS</span> DALL-E</h3><a href="#">Compare →</a></div>
        <div class="battle-card"><h3>Jasper <span class="vs-text">VS</span> Copy.ai</h3><a href="#">Compare →</a></div>
        <div class="battle-card"><h3>Perplexity <span class="vs-text">VS</span> Google</h3><a href="#">Compare →</a></div>
        <div class="battle-card"><h3>Sora <span class="vs-text">VS</span> Runway</h3><a href="#">Compare →</a></div>
    </div>

    <div class="list-section">
        <h2 style="text-align: center; margin-bottom: 30px;">Top 10 AI Tools Directory</h2>
        <div id="tool-list-container">
            </div>
    </div>

    <script>
        const toolsData = [
            { name: "ChatGPT", desc: "Leading AI for writing and coding.", rating: "4.9", link: "https://chat.openai.com" },
            { name: "Claude", desc: "Natural writing and deep reasoning assistant.", rating: "4.8", link: "https://claude.ai" },
            { name: "Gemini", desc: "Google's AI integrated with Workspace.", rating: "4.7", link: "https://gemini.google.com" },
            { name: "Midjourney", desc: "Top-tier AI for artistic image generation.", rating: "4.9", link: "https://midjourney.com" },
            { name: "Jasper", desc: "AI platform for business content creation.", rating: "4.6", link: "https://jasper.ai" },
            { name: "Canva AI", desc: "Simple AI tools for graphic design.", rating: "4.5", link: "https://canva.com" },
            { name: "Perplexity", desc: "Search engine with real-time citations.", rating: "4.8", link: "https://perplexity.ai" },
            { name: "Notion AI", desc: "AI writing assistant inside Notion.", rating: "4.7", link: "https://notion.so" },
            { name: "Leonardo.ai", desc: "Creative platform for image assets.", rating: "4.7", link: "https://leonardo.ai" },
            { name: "ElevenLabs", desc: "Realistic AI voice synthesis.", rating: "4.9", link: "https://elevenlabs.io" }
        ];

        function renderRows(filter = "") {
            const container = document.getElementById('tool-list-container');
            container.innerHTML = "";
            
            const filtered = toolsData.filter(t => t.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(t => {
                const row = document.createElement('div');
                row.className = "tool-row";
                row.innerHTML = `
                    <div class="tool-name">${t.name}</div>
