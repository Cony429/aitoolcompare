<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool Compare - Discover & Compare</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8f9fa; margin: 0; color: #333; }
        
        /* 1. 헤더: 가운데 정렬 및 사라진 메뉴 복구 */
        header { text-align: center; padding: 40px 20px; background: white; border-bottom: 1px solid #eee; }
        header .logo { font-size: 2.5rem; font-weight: 800; color: #007bff; text-decoration: none; display: block; margin-bottom: 20px; }
        header nav { display: flex; justify-content: center; gap: 30px; }
        header nav a { text-decoration: none; color: #666; font-weight: 600; font-size: 1.1rem; }
        header nav a:hover { color: #007bff; }

        /* 2. 검색창 & 버튼 추가 */
        .hero { padding: 40px 5%; text-align: center; }
        .search-container { max-width: 700px; margin: 0 auto; display: flex; gap: 10px; justify-content: center; }
        #search-input { 
            flex: 1; padding: 15px 25px; border-radius: 30px; 
            border: 2px solid #ddd; font-size: 1.1rem; outline: none;
        }
        #search-btn { 
            padding: 15px 30px; background: #007bff; color: white; border: none; 
            border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1.1rem;
        }
        #search-btn:hover { background: #0056b3; }

        /* 3. 비교 배틀 (5개) */
        .section-title { text-align: center; margin: 50px 0 20px; }
        .battle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 5%; }
        .battle-card { background: white; border: 1px solid #eee; padding: 25px; border-radius: 15px; text-align: center; }
        .vs-tag { color: #ff4757; font-weight: bold; }

        /* 4. Top 10 한 줄 리스트 */
        .list-area { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
        .tool-row { 
            display: grid; grid-template-columns: 1.5fr 3.5fr 0.8fr 1.2fr; 
            align-items: center; background: white; padding: 20px; 
            border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee;
        }
        .t-name { font-weight: bold; font-size: 1.2rem; }
        .t-desc { color: #777; font-size: 0.95rem; padding-right: 10px; }
        .t-rating { color: #f1c40f; font-weight: bold; text-align: center; }
        .visit-link { background: #007bff; color: white; padding: 10px; border-radius: 8px; text-decoration: none; text-align: center; font-weight: bold; }

        @media (max-width: 850px) { .tool-row { grid-template-columns: 1fr; text-align: center; gap: 15px; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">AI Tool Compare</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News</a>
            <a href="free-ai-tools.html">Free Tools</a>
            <a href="compare.html">Compare</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Find Your AI by Name or Category</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Try 'video', 'image', 'text', 'coding'...">
            <button id="search-btn">Search</button>
        </div>
    </div>

    <h2 class="section-title">Head-to-Head Battles</h2>
    <div class="battle-grid">
        <div class="battle-card"><h3>ChatGPT <span class="vs-tag">VS</span> Claude</h3><a href="chatgpt-vs-claude.html">Compare →</a></div>
        <div class="battle-card"><h3>Midjourney <span class="vs-tag">VS</span> DALL-E</h3><a href="#">Compare →</a></div>
        <div class="battle-card"><h3>Jasper <span class="vs-text">VS</span> Copy.ai</h3><a href="#">Compare →</a></div>
        <div class="battle-card"><h3>Perplexity <span class="vs-text">VS</span> Google</h3><a href="#">Compare →</a></div>
        <div class="battle-card"><h3>Sora <span class="vs-text">VS</span> Runway</h3><a href="#">Compare →</a></div>
    </div>

    <div class="list-area">
        <h2 class="section-title">Top 10 AI Tools Directory</h2>
        <div id="tool-display"></div>
    </div>

    <script>
        const aiTools = [
            { name: "ChatGPT", desc: "Best for writing, chat, and coding tasks.", rate: "4.9", url: "https://chat.openai.com", tags: "text, chat, writing, coding, productivity, assistant" },
            { name: "Claude", desc: "Natural writing and deep reasoning expert.", rate: "4.8", url: "https://claude.ai", tags: "text, writing, reasoning, analysis, research" },
            { name: "Gemini", desc: "Google's AI assistant for search and office.", rate: "4.7", url: "https://gemini.google.com", tags: "search, research, google, assistant, information" },
            { name: "Midjourney", desc: "Stunning high-quality artistic image generation.", rate: "4.9", url: "https://midjourney.com", tags: "image, art, design, creative, drawing, generation" },
            { name: "Jasper", desc: "Professional AI suite for marketing content.", rate: "4.6", url: "https://jasper.ai", tags: "text, marketing, business, writing, copy" },
            { name: "Canva AI", desc: "Intuitive AI design tools for everyone.", rate: "4.5", url: "https://canva.com", tags: "image, design, creative, photo, editing" },
            { name: "Perplexity", desc: "AI search engine with real-time sources.", rate: "4.8", url: "https://perplexity.ai", tags: "search, research, answer, citations, news" },
            { name: "Notion AI", desc: "Boost productivity inside your Notion pages.", rate: "4.7", url: "https://notion.so", tags: "text, writing, productivity, organization, notes" },
            { name: "Leonardo.ai", desc: "Creative platform for pro-quality image assets.", rate: "4.7", url: "https://leonardo.ai", tags: "image, art, asset, creative, 3d" },
            { name: "ElevenLabs", desc: "Leading AI for voice and speech synthesis.", rate: "4.9", url: "https://elevenlabs.io", tags: "audio, voice, speech, sound, music, podcast" },
            { name: "Sora", desc: "Next-gen realistic video generation by OpenAI.", rate: "4.9", url: "https://openai.com/sora", tags: "video, movie, animation, motion" },
            { name: "Runway", desc: "Creative AI tools for professional video editing.", rate: "4.7", url: "https://runwayml.com", tags: "video, movie, editing, motion, creative" }
        ];

        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.tags.toLowerCase().includes(val.toLowerCase()) ||
                t.desc.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center;'>No matching AI tools found.</p>";
                return;
            }

            filtered.forEach(t => {
                const row = document.createElement('div');
                row.className = "tool-row";
                row.innerHTML = `<div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div><div class="t-rating">⭐ ${t.rate}</div><a href="${t.url}" target="_blank" class="visit-link">Visit Site</a>`;
                div.appendChild(row);
            });
        }

        // 검색 버튼 클릭 및 엔터 키 이벤트
        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        render(); // 초기 로드
    </script>
</body>
</html>
