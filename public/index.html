            <input type="text" id="search-input" class="search-bar" placeholder="Try 'video', 'image', 'text', 'coding'...">
            <button id="search-btn">Search</button>

    <main class="container">
        <h2 class="section-title">Top AI Tools Directory</h2>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('nav');

        hamburger.addEventListener('click', () => {
            nav.classList.toggle('active');
        });

        let aiTools = [];

        async function fetchTools() {
            try {
                const response = await fetch('ai-tools.json');
                aiTools = await response.json();
                render();
            } catch (error) {
                console.error('Error fetching AI tools:', error);
                document.getElementById('tool-display').innerHTML = "<p style='text-align:center; padding: 20px;'>Could not load AI tools.</p>";
            }
        }

        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.category.toLowerCase().includes(val.toLowerCase()) ||
                t.description.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center; padding: 20px;'>No matching AI tools found.</p>";
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement('a');
                item.href = t.link;
                item.target = "_blank";
                item.className = "tool-item";

                // Simplified display - no rating or price type as it's not in the new data source
                item.innerHTML = `
                    <div class="tool-info">
                        <div class="tool-header">
                            <div class="tool-title">${t.name}</div>
                        </div>
                        <p class="tool-description">${t.description}</p>
                    </div>
                    <div class="btn-read-more">Visit Site</div>
                `;
                div.appendChild(item);
            });
        }

        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        // Fetch tools when the page loads
        fetchTools();
    </script>
