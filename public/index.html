    <script>
        let aiTools = [];

        async function fetchTools() {
            try {
                const response = await fetch('ai-tools.json');
                aiTools = await response.json();
                render();
            } catch (error) {
                console.error('Error fetching AI tools:', error);
                document.getElementById('tool-display').innerHTML = "<p style='text-align:center; padding: 20px;'>Could not load AI tools.</p>";
            }
        }

        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.category.toLowerCase().includes(val.toLowerCase()) ||
                t.description.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center; padding: 20px;'>No matching AI tools found.</p>";
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement('a');
                item.href = t.link;
                item.target = "_blank";
                item.className = "tool-card";

                let tagsHTML = '';
                if (t.pricing.includes("Free")) {
                    tagsHTML += `<span class="tag free-tag">Free</span>`;
                }
                if (t.pricing.includes("Paid")) {
                    tagsHTML += `<span class="tag paid-tag">Paid</span>`;
                }
                if (t.pricing.includes("Freemium")) {
                    tagsHTML += `<span class="tag freemium-tag">Freemium</span>`;
                }

                item.innerHTML = `
                    <div class="card-left">
                        <span class="tool-name">${t.name}</span>
                        <p class="tool-desc">${t.description}</p>
                    </div>
                    <div class="card-right">
                        <div class="tool-rating">${"⭐".repeat(Math.round(t.rating))} ${t.rating.toFixed(1)}</div>
                        <div class="tool-tags">${tagsHTML}</div>
                        <span class="visit-site">Visit Site</span>
                    </div>
                `;
                div.appendChild(item);
            });
        }

        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        fetchTools();
    </script>
