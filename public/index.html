    <script>
        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('nav');

        hamburger.addEventListener('click', () => {
            nav.classList.toggle('active');
        });

        const aiTools = [
            // Text/Chat
            { 
                name: "ChatGPT", 
                desc: "ChatGPT, created by OpenAI, is a highly advanced conversational AI built on the GPT (Generative Pre-trained Transformer) architecture. It excels at understanding and generating human-like text, making it a versatile tool for a vast range of tasks. Its core strength lies in its ability to engage in dynamic, context-aware dialogues, answer complex follow-up questions, and even admit when it's wrong. For professionals, it's an indispensable assistant for drafting emails, writing articles, and generating marketing copy. Developers leverage its power for writing, debugging, and explaining code in various programming languages. The model's creative capabilities extend to composing poetry, writing scripts, and brainstorming ideas. Its unique selling point is its adaptability; it can be fine-tuned for specific applications and integrated into existing workflows via the OpenAI API. The free version offers broad access, while the 'Plus' subscription provides priority access to new features and faster response times, making it a leader in productivity and creative AI.", 
                rate: "4.9", 
                url: "https://chat.openai.com", 
                tags: "text, chat, writing, coding, productivity", 
                type: "Freemium" 
            },
            { 
                name: "Claude", 
                desc: "Claude, developed by Anthropic, is a next-generation AI assistant designed with a strong emphasis on safety and ethical considerations. Its unique 'Constitutional AI' framework ensures that its responses are helpful, harmless, and honest. Claude's standout feature is its exceptionally large context window, allowing it to process and analyze hundreds of thousands of words at once. This makes it the ideal tool for summarizing lengthy research papers, financial reports, or legal documents with high accuracy. It excels in tasks requiring deep contextual understanding, nuanced writing, and collaborative brainstorming. For businesses, Claude offers a reliable solution for customer service, content moderation, and internal knowledge management. Its unique selling point is its commitment to responsible AI development, providing users with a powerful tool they can trust. Available through an API and a public beta, Claude is quickly becoming a favorite among researchers, writers, and professionals who handle large volumes of text.", 
                rate: "4.8", 
                url: "https://claude.ai", 
                tags: "text, writing, reasoning, research", 
                type: "Freemium" 
            },
            { 
                name: "Gemini", 
                desc: "Gemini is Google's most advanced and flexible AI model, engineered to be natively multimodal. This means it can seamlessly understand, operate across, and combine different types of information, including text, code, audio, images, and video. This multimodality allows for incredibly intuitive and powerful new user experiences. For instance, you can show Gemini a picture of a meal and it can provide a recipe, or give it a complex math problem and it can explain the solution step-by-step. Gemini is offered in several sizes—Ultra for highly complex tasks, Pro for a balance of performance and scalability, and Nano for on-device applications. Its key selling point is its deep integration into the Google ecosystem, powering features in Google Search, Ads, and Workspace. This allows Gemini to draw on real-time information and provide highly contextual, accurate, and creative responses, making it a formidable tool for both personal productivity and enterprise-level solutions.", 
                rate: "4.7", 
                url: "https://gemini.google.com", 
                tags: "search, google, assistant, research", 
                type: "Free" 
            },
            { 
                name: "Jasper", 
                desc: "Jasper is a premium AI writing assistant tailored for marketing and business content creation. It's designed to help teams produce high-quality, on-brand content at scale. Jasper's extensive library of over 50 templates covers everything from blog posts and social media captions to ad copy and video scripts. Its core feature, 'Brand Voice,' allows businesses to upload their style guides, ensuring that all generated content aligns with their specific tone and messaging. The 'Boss Mode' feature provides a long-form editor for writing complete articles and reports with AI assistance. A key selling point for Jasper is its focus on producing conversion-focused copy. It integrates with tools like Surfer SEO to optimize content for search engines and Grammarly for error-free writing. With its collaborative interface and robust feature set, Jasper positions itself as an end-to-end solution for enterprise content marketing, helping businesses overcome writer's block and accelerate their content pipeline.", 
                rate: "4.6", 
                url: "https://jasper.ai", 
                tags: "text, marketing, writing, copy", 
                type: "Paid" 
            },
        ];

        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.tags.toLowerCase().includes(val.toLowerCase()) ||
                t.desc.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center; padding: 20px;'>No matching AI tools found.</p>";
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement('a');
                item.href = t.url;
                item.target = "_blank";
                item.className = "tool-item";
                item.innerHTML = `
                    <div class="tool-info">
                        <div class="tool-header">
                            <div class="tool-title">${t.name}</div>
                            <div class="tool-meta">
                                <span class="tool-rating">${t.rate}/5</span>
                                <span class="tool-price ${t.type.toLowerCase()}">${t.type}</span>
                            </div>
                        </div>
                        <p class="tool-description">${t.desc}</p>
                    </div>
                    <div class="btn-read-more">Visit Site</div>
                `;
                div.appendChild(item);
            });
        }

        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        render();
    </script>
