    <script>
        let aiTools = [];

        async function fetchTools() {
            try {
                const response = await fetch('ai-tools.json');
                aiTools = await response.json();
                render();
            } catch (error) {
                console.error('Error loading AI tools:', error);
                document.getElementById('tool-display').innerHTML = "<p style='text-align:center; padding: 20px;'>Could not load AI tools.</p>";
            }
        }

        function render(query = "") {
            const toolDisplay = document.getElementById('tool-display');
            toolDisplay.innerHTML = "";
            const lowerCaseQuery = query.toLowerCase();

            const filteredTools = aiTools.filter(tool => {
                const toolKeywords = tool.keywords ? tool.keywords.map(k => k.toLowerCase()) : [];
                return (
                    tool.name.toLowerCase().includes(lowerCaseQuery) || 
                    tool.category.toLowerCase().includes(lowerCaseQuery) ||
                    tool.description.toLowerCase().includes(lowerCaseQuery) ||
                    toolKeywords.some(keyword => keyword.includes(lowerCaseQuery))
                );
            });

            if (filteredTools.length === 0) {
                toolDisplay.innerHTML = "<p style='text-align:center; padding: 20px;'>No matching AI tools found.</p>";
                return;
            }

            filteredTools.forEach(tool => {
                const toolItem = document.createElement('a');
                toolItem.href = tool.link;
                toolItem.target = "_blank";
                toolItem.className = "tool-card";

                let tagsHTML = '';
                if (tool.pricing.includes("Free")) {
                    tagsHTML += `<span class="tag free-tag">Free</span>`;
                }
                if (tool.pricing.includes("Paid")) {
                    tagsHTML += `<span class="tag paid-tag">Paid</span>`;
                }
                if (tool.pricing.includes("Freemium")) {
                    tagsHTML += `<span class="tag freemium-tag">Freemium</span>`;
                }


                toolItem.innerHTML = `
                    <div class="card-left">
                        <span class="tool-name">${tool.name}</span>
                        <p class="tool-desc">${tool.description}</p>
                    </div>
                    <div class="card-right">
                        <div class="tool-rating">${"⭐".repeat(Math.round(tool.rating))} ${tool.rating.toFixed(1)}</div>
                        <div class="tool-tags">${tagsHTML}</div>
                        <span class="visit-site">Visit Site</span>
                    </div>
                `;
                toolDisplay.appendChild(toolItem);
            });
        }

        document.getElementById('search-btn').addEventListener('click', () => render(document.getElementById('search-input').value));
        fetchTools();
    </script>
