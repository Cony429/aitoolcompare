<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News - Latest Updates | AI Tool Compare</title>
    <meta name="description" content="Breaking news and latest updates from the world of AI. Your source for information on new model releases, company announcements, and industry trends.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<header class="site-header">
    <div class="container header-container">
        <div class="logo">
            <a href="index.html">AI Tool Compare</a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="compare.html">Compare</a>
            <a href="blog.html">Blog</a>
            <a href="news.html" class="active">News</a>
            <div class="lang-switch">
                <a href="news.html">EN</a> | <a href="news-ko.html">KO</a>
            </div>
        </nav>
    </div>
</header>

<main>
    <section class="hero-section">
        <div class="container">
            <h1>Latest AI News</h1>
            <p class="subtitle">Your real-time source for significant developments in the AI industry.</p>
        </div>
    </section>

    <div class="main-content container" id="news-articles-container">
        
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-content">
        <div class="footer-links">
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
        <p class="copyright">&copy; 2026 AI Tool Compare. All rights reserved.</p>
    </div>
</footer>

<script>
    const newsArticles = [
        {
            title: "Google Launches Gemini 1.5 Pro with 1M Token Context Window",
            date: "February 15, 2026",
            summary: "Google AI has announced the release of Gemini 1.5 Pro, a new model boasting an unprecedented 1 million token context window. This allows for the analysis of massive codebases, entire books, and hours of video in a single prompt. Early benchmarks show strong performance in long-context retrieval and complex reasoning tasks.",
            link: "#"
        },
        {
            title: "Anthropic Raises $5B in New Funding Round Led by Tech Giants",
            date: "February 10, 2026",
            summary: "AI safety and research company Anthropic has secured $5 billion in a new funding round. The investment will be used to scale up the development of their next-generation models and expand their enterprise offerings. This move signals intense competition in the foundational model space.",
            link: "#"
        },
        {
            title: "OpenAI Previews Sora: A New Text-to-Video Model",
            date: "February 5, 2026",
            summary: "OpenAI has unveiled previews of its new text-to-video model, Sora, which can generate high-fidelity, minute-long videos from a single text prompt. The quality of the generated videos has stunned the creative community, sparking both excitement and concern about the future of video production.",
            link: "#"
        },
        {
            title: "Midjourney V7 Update Introduces Character Consistency and Enhanced Realism",
            date: "January 28, 2026",
            summary: "The popular AI image generator Midjourney has released its V7 update, which includes long-awaited features like character consistency across multiple images and significant enhancements to photorealism. The update aims to give creators more control and precision in their visual storytelling.",
            link: "#"
        }
    ];

    function renderNews() {
        const container = document.getElementById('news-articles-container');
        let articlesHtml = '';
        newsArticles.forEach(article => {
            articlesHtml += `
                <article class="news-article">
                    <h3><a href="${article.link}" style="text-decoration:none; color:inherit;">${article.title}</a></h3>
                    <p class="publish-date">${article.date}</p>
                    <p>${article.summary}</p>
                </article>
            `;
        });
        container.innerHTML = articlesHtml;
    }

    document.addEventListener('DOMContentLoaded', renderNews);
</script>

</body>
</html>
