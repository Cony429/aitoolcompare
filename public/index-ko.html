<body>
    <header>
        <a href="index-ko.html" class="logo">AI 도구 비교</a>

    <div class="hero">
        <h1>당신에게 가장 적합한 AI를 찾아보세요</h1>
        <p>다양한 AI 도구를 비교하고 최적의 선택을 하세요.</p>
        <div class="search-container">
            <input type="text" id="search-input" class="search-bar" placeholder="'비디오', '이미지', '글쓰기', '코딩' 등..." onkeyup="if(event.keyCode===13) document.getElementById('search-btn').click()">
            <button id="search-btn">검색</button>
        </div>
    </div>

    <main class="container">
        <h2 class="section-title">주요 AI 도구 디렉토리</h2>
        <div id="tool-display"></div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 AI 도구 비교. 모든 권리 보유.</p>
            <nav>
                <a href="about.html">소개</a>
                <a href="contact.html">문의</a>
                <a href="privacy-policy.html">개인정보처리방침</a>
            </nav>
        </div>
    </footer>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('nav');
        hamburger.addEventListener('click', () => nav.classList.toggle('active'));

        let aiTools = [];

        async function fetchTools() {
            try {
                const response = await fetch('ai-tools-ko.json');
                aiTools = await response.json();
                render();
            } catch (error) {
                console.error('AI 도구 로딩 오류:', error);
                document.getElementById('tool-display').innerHTML = "<p style='text-align:center; padding: 20px;'>AI 도구를 불러올 수 없습니다.</p>";
            }
        }

        function render(query = "") {
            const toolDisplay = document.getElementById('tool-display');
            toolDisplay.innerHTML = "";
            const filteredTools = aiTools.filter(tool => 
                tool.name.toLowerCase().includes(query.toLowerCase()) || 
                tool.category.toLowerCase().includes(query.toLowerCase()) ||
                tool.description.toLowerCase().includes(query.toLowerCase())
            );

            if (filteredTools.length === 0) {
                toolDisplay.innerHTML = "<p style='text-align:center; padding: 20px;'>일치하는 AI 도구가 없습니다.</p>";
                return;
            }

            filteredTools.forEach(tool => {
                const toolItem = document.createElement('a');
                toolItem.href = tool.link;
                toolItem.target = "_blank";
                toolItem.className = "tool-card";

                const freeTag = tool.pricing.includes("무료") ? '<span class="tag free-tag"><i class="fas fa-gift"></i> 무료</span>' : "";
                const paidTag = tool.pricing.includes("유료") ? '<span class="tag paid-tag"><i class="fas fa-credit-card"></i> 유료</span>' : "";
                const freemiumTag = tool.pricing.includes("부분 유료") ? '<span class="tag freemium-tag"><i class="fas fa-unlock-alt"></i> 부분 유료</span>' : "";


                toolItem.innerHTML = `
                    <div class="card-left">
                        <span class="tool-name">${tool.name}</span>
                        <p class="tool-desc">${tool.description}</p>
                    </div>
                    <div class="card-right">
                        <div class="tool-rating">${"&#11088;".repeat(Math.round(tool.rating))} ${tool.rating.toFixed(1)}</div>
                        <div class="tool-tags">
                            ${freeTag}
                            ${paidTag}
                            ${freemiumTag}
                        </div>
                        <span class="visit-site">사이트 방문 <i class="fas fa-arrow-right"></i></span>
                    </div>
                `;
                toolDisplay.appendChild(toolItem);
            });
        }

        document.getElementById('search-btn').addEventListener('click', () => render(document.getElementById('search-input').value));
        fetchTools();
    </script>
