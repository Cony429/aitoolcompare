<body>

        <a href="index.html" class="logo">AI 도구 비교</a>

            <a href="blog.html">블로그</a>

        </nav>
    </header>

    <div class="hero">
        <h1>당신에게 맞는 최고의 AI를 찾아보세요</h1>
        <p>다양한 AI 도구를 비교하고 최적의 선택을 하세요.</p>
        <div class="search-container">
            <input type="text" id="search-input" class="search-bar" placeholder="'비디오', '이미지', '텍스트', '코딩' 등을 입력해보세요...">
            <button id="search-btn">검색</button>
        </div>
    </div>

    <main class="container">
        <h2 class="section-title">최고의 AI 도구 디렉토리</h2>
        <div id="tool-display"></div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 AI 도구 비교. 모든 권리 보유.</p>
            <nav>
                <a href="about.html">소개</a>
                <a href="contact.html">문의</a>
                <a href="privacy-policy.html">개인정보 처리방침</a>
            </nav>
        </div>
    </footer>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('nav');

        hamburger.addEventListener('click', () => {
            nav.classList.toggle('active');
        });

        let aiTools = [];

        async function fetchTools() {
            try {
                const response = await fetch('../ai-tools.json');
                aiTools = await response.json();
                render();
            } catch (error) {
                console.error('AI 도구를 불러오는 중 오류 발생:', error);
                document.getElementById('tool-display').innerHTML = "<p style='text-align:center; padding: 20px;'>AI 도구를 불러올 수 없습니다.</p>";
            }
        }

        function render(val = "") {
            const div = document.getElementById('tool-display');
            div.innerHTML = "";
            const filtered = aiTools.filter(t => 
                t.name.toLowerCase().includes(val.toLowerCase()) || 
                t.category.toLowerCase().includes(val.toLowerCase()) ||
                t.description.toLowerCase().includes(val.toLowerCase())
            );

            if(filtered.length === 0) {
                div.innerHTML = "<p style='text-align:center; padding: 20px;'>일치하는 AI 도구를 찾을 수 없습니다.</p>";
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement('a');
                item.href = t.link;
                item.target = "_blank";
                item.className = "tool-item";

                item.innerHTML = `
                    <div class="tool-info">
                        <div class="tool-header">
                            <div class="tool-title">${t.name}</div>
                        </div>
                        <p class="tool-description">${t.description}</p>
                    </div>
                    <div class="btn-read-more">사이트 방문</div>
                `;
                div.appendChild(item);
            });
        }

        document.getElementById('search-btn').onclick = () => render(document.getElementById('search-input').value);
        document.getElementById('search-input').onkeyup = (e) => { if(e.key === "Enter") render(e.target.value); };

        fetchTools();
    </script>
</body>
