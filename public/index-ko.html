<script>
    let aiTools = [];

    async function fetchTools() {
        try {
            const response = await fetch('ai-tools-ko.json');
            aiTools = await response.json();
            render();
        } catch (error) {
            console.error('AI 도구 로딩 오류:', error);
            document.getElementById('tool-table-body').innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>AI 도구를 불러올 수 없습니다.</td></tr>";
        }
    }

    function render(query = "") {
        const tableBody = document.getElementById('tool-table-body');
        tableBody.innerHTML = "";
        const lowerCaseQuery = query.toLowerCase();

        const filteredTools = aiTools.filter(tool => {
            const toolKeywords = tool.keywords ? tool.keywords.map(k => k.toLowerCase()) : [];
            return (
                tool.name.toLowerCase().includes(lowerCaseQuery) || 
                tool.category.toLowerCase().includes(lowerCaseQuery) ||
                tool.description.toLowerCase().includes(lowerCaseQuery) ||
                toolKeywords.some(keyword => keyword.includes(lowerCaseQuery))
            );
        });

        if (filteredTools.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>일치하는 AI 도구가 없습니다.</td></tr>";
            return;
        }

        filteredTools.forEach(tool => {
            const row = document.createElement('tr');

            let tagsHTML = '';
            if (tool.pricing.includes("무료")) {
                tagsHTML += `<span class="tag free-tag">무료</span>`;
            }
            if (tool.pricing.includes("유료")) {
                tagsHTML += `<span class="tag paid-tag">유료</span>`;
            }
            if (tool.pricing.includes("부분 유료")) {
                tagsHTML += `<span class="tag freemium-tag">부분 유료</span>`;
            }

            row.innerHTML = `
                <td data-label="도구 이름">${tool.name}</td>
                <td data-label="설명">${tool.description}</td>
                <td data-label="평점" class="tool-rating">${"⭐".repeat(Math.round(tool.rating))} ${tool.rating.toFixed(1)}</td>
                <td data-label="가격">${tagsHTML}</td>
                <td data-label="링크"><a href="${tool.link}" target="_blank" class="visit-site-btn">사이트 방문</a></td>
            `;
            tableBody.appendChild(row);
        });
    }

    document.getElementById('search-btn').addEventListener('click', () => render(document.getElementById('search-input').value));
    fetchTools();
</script>
