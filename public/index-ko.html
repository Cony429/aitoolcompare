
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 도구 비교 2026 | Sora, Claude 3.5, Gemini 성능 및 가격 비교</title>
    <meta name="description" content="2026년 최신 AI 도구를 한눈에 비교하세요. Sora, Claude 3.5, Gemini 1.5 Pro의 성능, 평점, 가격 정보를 매일 업데이트하는 전문 AI 비교 사이트입니다.">
    <meta name="keywords" content="ai compare, ai tool comparison, best ai tools 2026, Sora vs Runway, AI 도구 비교, 인공지능 추천">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
<header class="site-header">
  <div class="nav-container">
    <a href="index-ko.html" class="logo">AI 도구 비교</a>
    <nav class="nav-links">
      <a href="index-ko.html">홈</a>
      <a href="compare-ko.html">비교</a>
      <a href="blog-ko.html">블로그</a>
      <a href="news-ko.html">뉴스</a>
    </nav>
    <div class="lang-switch">
      <a href="index.html">EN</a> | <a href="index-ko.html">KO</a>
    </div>
  </div>
</header>

<div class="hero-section">
    <h1>당신에게 가장 적합한 AI를 찾아보세요</h1>
    <p class="subtitle">다양한 AI 도구를 비교하고 최적의 선택을 하세요.</p>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="비디오, 이미지, 글쓰기, 코딩 등...">
        <button id="search-btn">검색</button>
    </div>
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterByCategory('전체', event)">전체</button>
        <button class="filter-btn" onclick="filterByCategory('채팅봇', event)">채팅봇</button>
        <button class="filter-btn" onclick="filterByCategory('영상', event)">영상</button>
        <button class="filter-btn" onclick="filterByCategory('이미지', event)">이미지</button>
        <button class="filter-btn" onclick="filterByCategory('글쓰기', event)">글쓰기</button>
        <button class="filter-btn" onclick="filterByCategory('코딩', event)">코딩</button>
        <button class="filter-btn" onclick="filterByCategory('오디오', event)">오디오</button>
    </div>
</div>

<main class="container">
    <h2 class="section-title">주요 AI 도구 디렉토리</h2>
    <div class="table-container">
      <table id="tool-table">
        <thead>
          <tr>
            <th>도구 이름</th>
            <th>설명</th>
            <th>평점</th>
            <th>가격</th>
            <th>링크</th>
          </tr>
        </thead>
        <tbody id="tool-table-body">
          <!-- AI 도구가 여기에 동적으로 삽입됩니다. -->
        </tbody>
      </table>
    </div>
</main>

<footer>
    <div class="footer-content">
        <p>&copy; 2024 AI 도구 비교. 모든 권리 보유.</p>
        <nav>
            <a href="about-ko.html">소개</a>
            <a href="contact-ko.html">문의</a>
            <a href="privacy-ko.html">개인정보처리방침</a>
        </nav>
    </div>
</footer>

<script>
    let allTools = [];
    let currentCategory = 'all';

    async function fetchTools() {
        try {
            const response = await fetch('ai-tools.json');
            allTools = await response.json();
            render();
        } catch (error) {
            console.error('AI 도구 로딩 오류:', error);
            document.getElementById('tool-table-body').innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>AI 도구를 불러올 수 없습니다.</td></tr>";
        }
    }

    function displayFilteredTools(filteredTools) {
        const tableBody = document.getElementById('tool-table-body');
        tableBody.innerHTML = "";

        if (filteredTools.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>일치하는 AI 도구가 없습니다.</td></tr>";
            return;
        }

        filteredTools.forEach(tool => {
            const row = document.createElement('tr');
            let tagsHTML = '';
            const lowerCasePricing = tool.pricing.map(p => p.toLowerCase());

            if (lowerCasePricing.includes("free")) {
                tagsHTML += `<span class="tag free-tag">무료</span>`;
            }
            if (lowerCasePricing.includes("paid")) {
                tagsHTML += `<span class="tag paid-tag">유료</span>`;
            }
            if (lowerCasePricing.includes("freemium")) {
                tagsHTML += `<span class="tag freemium-tag">부분 유료</span>`;
            }

            row.innerHTML = `
                <td data-label="도구 이름">${tool.name}</td>
                <td data-label="설명">${tool.description}</td>
                <td data-label="평점" class="tool-rating">${"⭐".repeat(Math.round(tool.rating))} ${tool.rating.toFixed(1)}</td>
                <td data-label="가격">${tagsHTML}</td>
                <td data-label="링크"><a href="${tool.link}" target="_blank" class="visit-site-btn">사이트 방문</a></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function render(query = "") {
        const lowerCaseQuery = query.toLowerCase();
        let filteredTools = allTools;

        if (currentCategory !== 'all') {
            filteredTools = filteredTools.filter(tool => tool.category && tool.category.toLowerCase() === currentCategory.toLowerCase());
        }

        if (lowerCaseQuery) {
            filteredTools = filteredTools.filter(tool => {
                const toolKeywords = tool.keywords ? tool.keywords.map(k => k.toLowerCase()) : [];
                return (
                    tool.name.toLowerCase().includes(lowerCaseQuery) || 
                    tool.description.toLowerCase().includes(lowerCaseQuery) ||
                    toolKeywords.some(keyword => keyword.includes(lowerCaseQuery))
                );
            });
        }
        
        displayFilteredTools(filteredTools);
    }

    function filterByCategory(category, event) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const map = {'전체': 'all', '채팅봇':'Chatbot', '영상':'Video', '이미지':'Image', '글쓰기':'Writing', '코딩':'Coding', '오디오':'Audio'};
        currentCategory = map[category] || 'all';
        
        const query = document.getElementById('search-input').value;
        render(query);
    }

    document.getElementById('search-btn').addEventListener('click', () => {
        const query = document.getElementById('search-input').value;
        render(query);
    });

    document.getElementById('search-input').addEventListener('keyup', (event) => {
        if (event.key === 'Enter') {
            const query = document.getElementById('search-input').value;
            render(query);
        }
    });

    fetchTools();
</script>
</body>
</html>
