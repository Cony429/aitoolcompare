<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare AI Tools - AI Tool Compare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="/" class="logo">AI Tool Compare</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="compare.html">Compare</a>
            <a href="news.html">News</a>
        </nav>
    </header>

    <main class="container">
        <div class="compare-box">
            <h2>Build your own comparison</h2>
            <div class="tool-selector">
                <select id="tool1-select"></select>
                <span>VS</span>
                <select id="tool2-select"></select>
                <button id="compare-btn">Compare</button>
            </div>
            <div id="comparison-result"></div>
        </div>

        <!-- VS Section -->
        <section class="vs-section">
            <h2>Head-to-Head Battles</h2>
            <div class="vs-grid">
                <a href="chatgpt-vs-claude.html" class="vs-card">
                    <div class="vs-card-content">
                        <span>ChatGPT</span>
                        <span class="vs-separator">VS</span>
                        <span>Claude</span>
                    </div>
                    <p>View Comparison &rarr;</p>
                </a>
                <a href="midjourney-vs-dalle.html" class="vs-card">
                    <div class="vs-card-content">
                        <span>Midjourney</span>
                        <span class="vs-separator">VS</span>
                        <span>DALL-E 3</span>
                    </div>
                    <p>View Comparison &rarr;</p>
                </a>
                <a href="#" class="vs-card">
                    <div class="vs-card-content">
                        <span>Jasper</span>
                        <span class="vs-separator">VS</span>
                        <span>Copy.ai</span>
                    </div>
                    <p>View Comparison &rarr;</p>
                </a>
                <a href="#" class="vs-card">
                    <div class="vs-card-content">
                        <span>Perplexity</span>
                        <span class="vs-separator">VS</span>
                        <span>Google</span>
                    </div>
                    <p>View Comparison &rarr;</p>
                </a>
                 <a href="#" class="vs-card">
                    <div class="vs-card-content">
                        <span>Sora</span>
                        <span class="vs-separator">VS</span>
                        <span>Runway</span>
                    </div>
                    <p>View Comparison &rarr;</p>
                </a>
            </div>
        </section>
    </main>

    <script src="compare.js"></script>
</body>
</html>
