<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool Comparison - Interactive</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; margin: 0; color: #333; }
        
        /* 통일된 가운데 정렬 헤더 */
        header { text-align: center; padding: 40px 20px; background: white; border-bottom: 1px solid #eee; }
        header .logo { font-size: 2.5rem; font-weight: 800; color: #007bff; text-decoration: none; display: block; margin-bottom: 20px; }
        header nav { display: flex; justify-content: center; gap: 30px; }
        header nav a { text-decoration: none; color: #666; font-weight: 600; font-size: 1.1rem; }
        header nav a:hover { color: #007bff; }

        /* 비교 섹션 스타일 */
        .compare-hero { padding: 60px 5%; text-align: center; background: white; }
        .builder-box { max-width: 800px; margin: 0 auto; padding: 40px; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .select-group { display: flex; gap: 20px; justify-content: center; align-items: center; margin-bottom: 30px; }
        select { padding: 15px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; width: 250px; outline: none; }
        .vs-badge { background: #ff4757; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        #compare-btn { padding: 15px 50px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        #compare-btn:hover { background: #0056b3; }

        /* 비교 결과 표 스타일 */
        #result-display-area { max-width: 900px; margin: 50px auto; padding: 0 20px; display: none; } /* 처음엔 숨김 */
        .result-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .result-table th { background: #007bff; color: white; padding: 20px; font-size: 1.2rem; }
        .result-table td { padding: 18px; border-bottom: 1px solid #eee; text-align: center; }
        .feature-name { font-weight: bold; background: #f8f9fa; text-align: left !important; width: 30%; }

        @media (max-width: 768px) {
            .select-group { flex-direction: column; }
            select { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">AI Tool Compare</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News</a>
            <a href="free-ai-tools.html">Free Tools</a>
            <a href="compare.html">Compare</a>
        </nav>
    </header>

    <section class="compare-hero">
        <h1>Compare Top 50+ AI Tools</h1>
        <div class="builder-box">
            <div class="select-group">
                <select id="tool1-select">
                    <option value="">Select First Tool</option>
                    <option value="ChatGPT">ChatGPT</option>
                    <option value="Claude">Claude</option>
                    <option value="Gemini">Gemini</option>
                    <option value="Midjourney">Midjourney</option>
                    <option value="Perplexity">Perplexity</option>
                </select>
                <div class="vs-badge">VS</div>
                <select id="tool2-select">
                    <option value="">Select Second Tool</option>
                    <option value="Claude">Claude</option>
                    <option value="ChatGPT">ChatGPT</option>
                    <option value="Gemini">Gemini</option>
                    <option value="DALL-E 3">DALL-E 3</option>
                    <option value="Runway">Runway</option>
                </select>
            </div>
            <button id="compare-btn">Compare Now</button>
        </div>
    </section>

    <div id="result-display-area">
        <table class="result-table">
            <thead>
                <tr>
                    <th>Feature</th>
                    <th id="name1-header">Tool 1</th>
                    <th id="name2-header">Tool 2</th>
                </tr>
            </thead>
            <tbody>
                <tr><td class="feature-name">Category</td><td id="cat1">AI Model</td><td id="cat2">AI Model</td></tr>
                <tr><td class="feature-name">User Rating</td><td>⭐ 4.9</td><td>⭐ 4.8</td></tr>
                <tr><td class="feature-name">Best Use Case</td><td id="use1">General/Coding</td><td id="use2">Reasoning/Writing</td></tr>
                <tr><td class="feature-name">Model Version</td><td>2026 Latest</td><td>2026 Latest</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('compare-btn').addEventListener('click', function() {
            const t1 = document.getElementById('tool1-select').value;
            const t2 = document.getElementById('tool2-select').value;
            const resultArea = document.getElementById('result-display-area');

            if (!t1 || !t2) {
                alert("Please select both tools to compare!");
                return;
            }
            if (t1 === t2) {
                alert("Please select different tools!");
                return;
            }

            // 표 내용 업데이트 및 표시
            document.getElementById('name1-header').innerText = t1;
            document.getElementById('name2-header').innerText = t2;
            
            // 결과 영역 보이기
            resultArea.style.display = 'block';
            
            // 화면을 결과 위치로 부드럽게 이동
            resultArea.scrollIntoView({ behavior: 'smooth' });
        });
    </script>

</body>
</html>
