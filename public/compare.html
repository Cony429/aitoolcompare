
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare AI Tools | AI Tool Compare</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="comparison.css">
</head>
<body>
    <header class="site-header">
      <div class="nav-container">
        <a href="index.html" class="logo">AI Tool Compare</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="compare.html">Compare</a>
          <a href="blog.html">Blog</a>
          <a href="news.html">News</a>
        </nav>
        <div class="lang-switch">
          <a href="index.html">EN</a> | <a href="index-ko.html">KO</a>
        </div>
      </div>
    </header>

    <main class="content-container">
        <div class="comparison-header">
            <h1>AI Tool Comparison</h1>
            <p>Select tools to see a side-by-side comparison.</p>
        </div>
        <div class="comparison-area">
            <div class="tool-selection">
                <div class="tool-selector" id="selector1">
                    <select onchange="updateComparison(1, this.value)">
                        <option value="">Select Tool 1</option>
                    </select>
                </div>
                <div class="tool-selector" id="selector2">
                    <select onchange="updateComparison(2, this.value)">
                        <option value="">Select Tool 2</option>
                    </select>
                </div>
            </div>
            <div class="comparison-table-container">
                <div class="comparison-column" id="column1">
                    <!-- Tool 1 details -->
                </div>
                <div class="comparison-column" id="column2">
                    <!-- Tool 2 details -->
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="privacy-policy.html">Privacy Policy</a>
          <a href="terms.html">Terms of Service</a>
        </div>
        <p class="copyright">&copy; 2026 AI Tool Compare. All rights reserved.</p>
      </div>
    </footer>

    <script src="comparison.js"></script>
</body>
</html>
