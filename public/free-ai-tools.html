<head>

    <title>Free AI Tools - AI Tool Compare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 5%; }
        .tool-card { border: 1px solid #eee; padding: 20px; border-radius: 12px; background: white; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tool-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .tool-card h3 { margin: 0 0 10px 0; color: #333; }
        .tool-card p { font-size: 0.9rem; color: #666; line-height: 1.5; margin-bottom: 20px; }
        .visit-btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">AIToolCompare</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News</a>
            <a href="free-ai-tools.html">Free AI Tools</a>
            <a href="compare.html">Interactive Compare</a>
        </nav>
        <a href="#" class="subscribe-btn">Subscribe</a>
    </header>

    <main>
        <h1 style="text-align: center; margin-top: 50px;">Free AI Tools Directory</h1>
        <div id="tool-list" class="tool-grid">
            <p style="text-align: center; grid-column: 1/-1;">데이터를 불러오는 중입니다...</p>
        </div>
    </main>

    <script src="free-ai-tools.js"></script>
</body>
